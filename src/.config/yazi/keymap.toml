[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "Open lazygit"

[[mgr.prepend_keymap]]
on   = [ "b", "d" ]
run  = "plugin fazif faziffd"
desc = "Find files with fd"

[[mgr.prepend_keymap]]
on   = [ "b", "r" ]
run  = "plugin fazif fazifrg"
desc = "Search with ripgrep"
